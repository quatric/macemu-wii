name: Wii and Wii U

on:
  push:
    tags-ignore: [latest]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The in-app updaters (libwiiupdate, libwiiuupdate) check the releases of
  # the repository they were built from. Each release carries Basilisk II and
  # SheepShaver for the Wii and the Wii U; each app only takes its own zip.
  UPDATE_OWNER: ${{ github.repository_owner }}
  UPDATE_REPO: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    strategy:
      fail-fast: false
      matrix:
        console: [wii, wiiu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install zip, perl, a host compiler and wiiu-sdl2
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends zip perl gcc g++ libc6-dev
          # the image usually ships it already
          if [ "${{ matrix.console }}" = wiiu ]; then
            dkp-pacman -Q wiiu-sdl2 || dkp-pacman -Sy --noconfirm --needed wiiu-sdl2
          fi
      - name: Build and package
        shell: bash
        run: |
          args=(UPDATE_OWNER="$UPDATE_OWNER" UPDATE_REPO="$UPDATE_REPO")
          # A v1.2.0 tag builds version 1.2.0, which the updater compares with newer tags.
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            args+=(VERSION="${GITHUB_REF_NAME#v}")
          fi
          make -C ${{ matrix.console }} -j"$(nproc)" "${args[@]}"
          make -C ${{ matrix.console }} "${args[@]}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.console }}
          if-no-files-found: error
          path: ${{ matrix.console }}/dist/*.zip

  # Every push to the default branch refreshes the "latest" release (the
  # updaters ignore that tag); v* tags get their own release.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: macemu Wii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of Basilisk II and SheepShaver for the Wii and Wii U from ${{ github.sha }}.

            Wii: extract BasiliskIIWii-*-hbc.zip or SheepShaverWii-*-hbc.zip to the root of your SD card or USB drive and open it from the Homebrew Channel. Basilisk II wants a 68k Mac ROM (as ROM or name.rom) and your disk images in sd:/apps/BasiliskIIWii/; SheepShaver wants the "Mac OS ROM" file of Mac OS 8.6 to 9.0.4 (or a 4 MB old world ROM) and your disk images in sd:/apps/SheepShaverWii/.

            Wii U (Aroma): extract BasiliskIIWiiU-*-wiiu.zip or SheepShaverWiiU-*-wiiu.zip to the root of your SD card, put the ROM and disk images in sd:/wiiu/apps/BasiliskIIWiiU/ or sd:/wiiu/apps/SheepShaverWiiU/ and open it from the Wii U Menu.

            SheepShaver interprets the PowerPC (no JIT is possible on these consoles), so Mac OS 8.6 and 9 run slowly. See wii/README.md.
          files: out/*.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: macemu Wii ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Wii: extract BasiliskIIWii-*-hbc.zip or SheepShaverWii-*-hbc.zip to the root of your SD card or USB drive and open it from the Homebrew Channel. Basilisk II wants a 68k Mac ROM (as ROM or name.rom) and your disk images in sd:/apps/BasiliskIIWii/; SheepShaver wants the "Mac OS ROM" file of Mac OS 8.6 to 9.0.4 (or a 4 MB old world ROM) and your disk images in sd:/apps/SheepShaverWii/.

            Wii U (Aroma): extract BasiliskIIWiiU-*-wiiu.zip or SheepShaverWiiU-*-wiiu.zip to the root of your SD card, put the ROM and disk images in sd:/wiiu/apps/BasiliskIIWiiU/ or sd:/wiiu/apps/SheepShaverWiiU/ and open it from the Wii U Menu.

            SheepShaver interprets the PowerPC (no JIT is possible on these consoles), so Mac OS 8.6 and 9 run slowly. See wii/README.md.
          files: out/*.zip
